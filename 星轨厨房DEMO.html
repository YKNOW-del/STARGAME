<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星轨厨房 · v0.6.2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #04060d; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #dfe6ff; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  canvas { display: block; width: 100%; height: 100%; border-radius: 10px; }

  /* ---------- 顶部栏 ---------- */
  #topbar { position: absolute; top: 0; left: 0; right: 0; height: 58px; display: flex;
    align-items: center; gap: 14px; padding: 0 16px;
    background: linear-gradient(180deg, rgba(6,10,26,.92), rgba(6,10,26,.55) 80%, transparent);
    border-radius: 10px 10px 0 0; }
  #lvlname { font-weight: bold; font-size: 17px; color: #ffd76a; white-space: nowrap; }
  #stats { font-size: 14px; color: #aab6e8; white-space: nowrap; }
  #stats b { color: #fff; font-weight: 600; }
  #hint { flex: 1; text-align: center; font-size: 12.5px; color: #7d89b8; white-space: nowrap; overflow: hidden; }
  .btn { background: rgba(70,90,180,.25); color: #dfe6ff; border: 1px solid rgba(130,150,255,.35);
    border-radius: 8px; padding: 5px 12px; font-size: 14px; cursor: pointer; user-select: none; }
  .btn:hover { background: rgba(90,110,210,.4); }
  .btn.big { font-size: 16px; padding: 9px 22px; }
  .btn.gold { border-color: rgba(255,215,106,.6); color: #ffd76a; }
  .btn:disabled { opacity: .35; cursor: default; }

  /* ---------- 底部栏 ---------- */
  #bottombar { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; display: flex;
    align-items: center; justify-content: center; gap: 26px;
    background: linear-gradient(0deg, rgba(6,10,26,.92), rgba(6,10,26,.55) 80%, transparent);
    border-radius: 0 0 10px 10px; }
  #tools { display: flex; flex-direction: column; gap: 6px; }
  #tools .btn { font-size: 13px; padding: 4px 10px; }
  #tools .btn.active { background: rgba(255,215,106,.25); border-color: #ffd76a; color: #ffd76a; }
  #pool { display: flex; gap: 12px; }
  .card { width: 96px; height: 66px; border-radius: 10px; border: 2px solid rgba(120,140,255,.25);
    background: rgba(10,16,38,.75); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; cursor: pointer; }
  .card:hover { border-color: rgba(160,180,255,.55); }
  .card.sel { border-color: #ffd76a; box-shadow: 0 0 14px rgba(255,215,106,.35); }
  .card .dot { width: 26px; height: 26px; border-radius: 50%; }
  .card .nm { font-size: 12.5px; color: #cfd8ff; }

  /* ---------- 提示 ---------- */
  #toast { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%);
    background: rgba(10,16,38,.9); border: 1px solid rgba(130,150,255,.35); color: #ffe9a8;
    padding: 7px 18px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .25s;
    pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #tutSkip { position: absolute; top: 66px; right: 16px; z-index: 6; display: none;
    background: rgba(20,30,64,.85); border-color: rgba(255,215,106,.5); color: #ffd76a; font-size: 13px; }

  /* ---------- 覆盖层 ---------- */
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(3,5,12,.72); backdrop-filter: blur(3px); border-radius: 10px; z-index: 10; }
  #overlay.show { display: flex; }
  .panel { background: rgba(10,16,38,.92); border: 1px solid rgba(130,150,255,.3); border-radius: 16px;
    padding: 30px 44px; text-align: center; max-width: 720px; box-shadow: 0 10px 50px rgba(0,0,0,.6); }
  .panel h1 { font-size: 40px; color: #ffd76a; letter-spacing: 6px; margin-bottom: 6px; text-shadow: 0 0 24px rgba(255,215,106,.45); }
  .panel h2 { font-size: 26px; color: #ffd76a; margin-bottom: 12px; }
  .panel .sub { color: #8896c8; font-size: 14px; margin-bottom: 22px; }
  .levels { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .lvlbtn { width: 150px; padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(130,150,255,.35);
    background: rgba(20,30,64,.6); cursor: pointer; }
  .lvlbtn:hover:not(.lock) { border-color: #ffd76a; background: rgba(50,60,120,.55); }
  .lvlbtn.lock { opacity: .4; cursor: default; }
  .lvlbtn .no { font-size: 12px; color: #8896c8; }
  .lvlbtn .nm { font-size: 15px; font-weight: bold; color: #e8ecff; margin: 3px 0 5px; }
  .lvlbtn .st { color: #ffd76a; font-size: 13px; letter-spacing: 2px; }
  .row { display: flex; gap: 14px; justify-content: center; margin-top: 20px; }
  .stat { text-align: left; font-size: 14px; color: #aab6e8; line-height: 1.9; }
  .stat b { color: #fff; }
  .stat .gold { color: #ffd76a; }
  .stars-big { font-size: 42px; color: #ffd76a; letter-spacing: 10px; text-shadow: 0 0 20px rgba(255,215,106,.5); margin: 6px 0 10px; }
  details { margin-top: 16px; text-align: left; color: #8896c8; font-size: 13px; }
  details summary { cursor: pointer; color: #aab6e8; }
  details li { margin: 4px 0 4px 18px; }
  .foot { margin-top: 14px; font-size: 12px; color: #5a6690; }
  .dexgrid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 700px; }
  .dexcell { width: 88px; padding: 8px 4px; border-radius: 10px; border: 1px solid rgba(130,150,255,.25);
    background: rgba(20,30,64,.5); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .dexcell:hover { border-color: rgba(160,180,255,.6); }
  .dexcell .dot { width: 22px; height: 22px; border-radius: 50%; }
  .dexcell .nm { font-size: 11.5px; color: #cfd8ff; }
  .dexcell:not(.un) .nm { color: #5a6690; }
  table.lb { margin: 0 auto; border-collapse: collapse; font-size: 13.5px; }
  table.lb th, table.lb td { padding: 5px 12px; border-bottom: 1px solid rgba(130,150,255,.2); }
  table.lb th { color: #8896c8; font-weight: 600; }
  .panel input[type="text"], .panel input:not([type]) {
    color: #fff; border: 1px solid rgba(130,150,255,.4); background: rgba(10,16,38,.8);
    border-radius: 6px; padding: 4px 10px; font-size: 14px; outline: none; }
  .panel input[type="range"] { vertical-align: middle; width: 180px; }
  .card.var.ice { border-color: #9fe8ff; box-shadow: 0 0 10px rgba(159,232,255,.3); }
  .card.var.pulse { border-color: #ffb37a; box-shadow: 0 0 10px rgba(255,179,122,.3); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1600" height="900"></canvas>

  <div id="topbar" style="display:none">
    <div id="lvlname"></div>
    <div id="stats"></div>
    <div id="hint"></div>
    <button class="btn" id="bDex">📖 图鉴</button>
    <button class="btn" id="bSet">⚙</button>
    <button class="btn" id="bPause">⏸ 暂停</button>
    <button class="btn" id="bMute">🔊</button>
    <button class="btn" id="bMenu">菜单</button>
  </div>

  <div id="bottombar" style="display:none">
    <div id="tools">
      <button class="btn" id="tDiscard">✕ 弃置 ×<b id="cDiscard">2</b></button>
      <button class="btn" id="tSlide">↔ 潮汐滑移 ×<b id="cSlide">2</b></button>
    </div>
    <div id="pool"></div>
  </div>

  <div id="toast"></div>
  <button id="tutSkip" class="btn">跳过教程 ▶</button>
  <div id="overlay"></div>
</div>

<script src="mobile/core/starchef-core.js"></script>
<script>
'use strict';
/* =============== 数据（由平台无关核心模块提供，NFR-M03） =============== */
const C = StarChef;
const { BODIES, DEX, LEVELS, ME, MS, ORBITS, OFFS, mass, fmtMass, slotAngle, validName, neighborSlots, dexIdOf } = C;

const RADII  = [118, 182, 246, 310];
const CX = 770, CY = 486;

const CONST_PTS = [[.5,.18],[.12,.62],[.88,.55],[.5,.92]];
const CONST_RECT = { x:1178, y:132, w:372, h:240 };
const TUT_CONS = { x: CONST_RECT.x - 28, y: CONST_RECT.y - 44, w: CONST_RECT.w + 56, h: CONST_RECT.h + 88 };

/* =============== 新手教程（FR-701/702：渐进引导、可跳过、可重看） =============== */
function firstEmptySlotRect(ks) {
  for (const k of ks) for (let i = 0; i < ORBITS[k]; i++)
    if (!S.board[k][i]) { const [x, y] = slotPos(k, i); return { x: x - 36, y: y - 36, w: 72, h: 72 }; }
  return null;
}
function deliverableRect() {
  for (let k = 0; k < 4; k++) for (let i = 0; i < ORBITS[k]; i++) {
    const b = S.board[k][i];
    if (b && canDeliver(b.t)) { const [x, y] = slotPos(k, i); const r = bodyR(b.t) + 12;
      return { x: x - r, y: y - r, w: 2 * r, h: 2 * r }; }
  }
  return null;
}
function markNeighborRect() {
  if (!S.tut || !S.tut.mark) return null;
  const [k, i] = S.tut.mark;
  for (const d of [1, -1]) { const j = (i + d + ORBITS[k]) % ORBITS[k];
    if (!S.board[k][j]) { const [x, y] = slotPos(k, j); return { x: x - 36, y: y - 36, w: 72, h: 72 }; } }
  return null;
}
function warnRect() {
  if (!S.warns.length) return null;
  const w = S.warns[0], [x, y] = slotPos(w.k, w.i);
  return { x: x - 40, y: y - 40, w: 80, h: 80 };
}
const TUT = {
  1: [ // 第 1 关：候选池 → 投放 → 交付 → 自动合成
    { text: '欢迎来到星轨厨房！我是你的领航员。这一关的目标：为订单星座合成 2 颗小行星。跟着提示，几步学会核心操作。', wait: 'any' },
    { text: '这是候选池——每次投放都从这里选天体。点击任意一张卡片。', wait: ['pool-select', 'placed'], hl: { dom: '#pool' } },
    { text: '点击高亮的空槽位，把这颗小行星投放到轨道上。', wait: 'placed', pool: [2, 2, 2], hl: { fn: () => firstEmptySlotRect([0, 1]) } },
    { text: '带金色圆圈的天体正是订单需要的！点击它完成交付。', wait: 'delivered', hl: { fn: deliverableRect } },
    { text: '看到了吗？星座被点亮了一颗——全部点亮即通关。', wait: 'any', hl: { rect: TUT_CONS } },
    { text: '接下来学合成：再投放一颗小行星，放哪个空位都行。', wait: 'placed', pool: [2, 2, 2], mark: true },
    { text: '把下一颗小行星放到刚才那颗的旁边（高亮处）——相邻同级会自动合成并迁往外轨！', wait: 'merged', pool: [2, 2, 2], hl: { fn: markNeighborRect } },
    { text: '两颗小行星合成了冥王星！订单还差 1 颗小行星——靠自己完成吧 ✨', wait: 'any' },
  ],
  2: [ // 第 2 关：订单星座面板 + 陨石预警
    { text: '第 2 关：订单变复杂了。右上角的订单星座告诉你需要交付什么——每颗星下方有名称与数量进度。', wait: 'any', hl: { rect: TUT_CONS } },
    { text: '注意！槽位上出现红色预警圈——3 秒后陨石将命中此处，被砸中的天体会降一级。趁早交付或挪走它！',
      wait: 'warn-shown', onStart: () => { S.nextMeteorAt = Math.min(S.nextMeteorAt, S.time + 1.5); }, hl: { fn: warnRect } },
    { text: '本关订单：小行星 ×2 + 月球 ×1。小心陨石，出发！', wait: 'any' },
  ],
  3: [ // 第 3 关：潮汐滑移 + 弃置
    { text: '第 3 关教你两个脱困道具。这是「潮汐滑移」：把天体沿轨道挪到空位，用于断开不想发生的相邻合成。', wait: 'any', hl: { dom: '#tSlide' } },
    { text: '点击「↔ 潮汐滑移」按钮启用它。', wait: 'slide-armed', hl: { dom: '#tSlide' } },
    { text: '现在点击一个天体，再点击同一轨道的空槽位，完成一次滑移。', wait: 'slide-used' },
    { text: '这是「弃置」：直接移除一个天体，但质量计入损失、影响三星——留作最后手段。', wait: 'any', hl: { dom: '#tDiscard' } },
    { text: '最后提醒：彗星每 5 秒漂移一格，规划时要留余量。去完成火星订单吧！', wait: 'any' },
  ],
};
function tutEvent(name) {
  if (!S || !S.tut) return;
  const st = S.tut.steps[S.tut.idx]; if (!st) return;
  const w = st.wait;
  if (Array.isArray(w) ? w.includes(name) : w === name) advanceTut();
}
function advanceTut() {
  const t = S.tut; if (!t) return;
  t.idx++;
  if (t.idx >= t.steps.length) { finishTutorial(); return; }
  applyTutStep();
}
function applyTutStep() {
  const st = S.tut.steps[S.tut.idx]; if (!st) return;
  st._at = performance.now();
  if (st.pool) { S.pool = st.pool.slice(); updateHUD(); }
  if (st.onStart) st.onStart();
}
function finishTutorial() {
  if (S && S.tut) { SAVE.tut[S.lvlIdx + 1] = 1; persist(); S.tut = null; }
  refreshTutSkip();
}
function refreshTutSkip() {
  document.getElementById('tutSkip').style.display = (S && S.tut) ? 'block' : 'none';
}
function tutRect(st) {
  if (!st.hl) return null;
  const cvr = cv.getBoundingClientRect(), sc = 1600 / cvr.width;
  if (st.hl.dom) { const el = document.querySelector(st.hl.dom); if (!el) return null;
    const r = el.getBoundingClientRect();
    return { x: (r.left - cvr.left) * sc, y: (r.top - cvr.top) * sc, w: r.width * sc, h: r.height * sc }; }
  if (st.hl.slot) { const [x, y] = slotPos(st.hl.slot[0], st.hl.slot[1]); return { x: x - 36, y: y - 36, w: 72, h: 72 }; }
  if (st.hl.rect) return st.hl.rect;
  if (st.hl.fn) return st.hl.fn();
  return null;
}
document.addEventListener('pointerdown', e => {
  if (!S || !S.tut || MODE !== 'play') return;
  if (e.target.closest && e.target.closest('#tutSkip')) return;
  const st = S.tut.steps[S.tut.idx];
  if (st && st.wait === 'any' && performance.now() - (st._at || 0) > 200) advanceTut();
}, true);
document.getElementById('tutSkip').addEventListener('click', e => {
  e.stopPropagation(); sfx.click(); finishTutorial(); toast('教程已跳过，可从主菜单重新查看');
});

/* =============== 存档 =============== */
const SAVE_KEY = 'starchef_save_v1';
const DEF_SETTINGS = { bgm: .5, se: .8, muted: false, colorblind: false, reducedMotion: false };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s.unlocked === 'number') {
      s.dex = Array.isArray(s.dex) ? s.dex : [];
      s.playerName = typeof s.playerName === 'string' ? s.playerName : '';
      s.leaderboard = Array.isArray(s.leaderboard) ? s.leaderboard : [];
      s.endlessBoard = Array.isArray(s.endlessBoard) ? s.endlessBoard : [];
      s.dailyBoard = Array.isArray(s.dailyBoard) ? s.dailyBoard : [];
      s.dynBoard = Array.isArray(s.dynBoard) ? s.dynBoard : [];
      s.achievements = Array.isArray(s.achievements) ? s.achievements : [];
      s.stats = Object.assign({ totalDeliveredKg: 0, maxCombo: 0, maxTier: 0 }, s.stats || {});
      s.settings = Object.assign({}, DEF_SETTINGS, s.settings || {});
      s.settings.muted = (s.settings && s.settings.muted !== undefined) ? s.settings.muted : !!s.muted;
      return s;
    } } catch (e) {}
  return { unlocked:1, stars:{}, best:{}, dex:[], playerName:'', leaderboard:[], endlessBoard:[], dailyBoard:[],
           dynBoard:[], achievements:[],
           stats:{ totalDeliveredKg:0, maxCombo:0, maxTier:0 }, settings:Object.assign({}, DEF_SETTINGS) };
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
let SAVE = loadSave();
if (!SAVE.tut) SAVE.tut = {};

/* =============== 音频（Web Audio 实时合成） =============== */
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  startBgm();
}
function tone(f, dur, type, g, delay, slideTo) {
  if (!AC || SAVE.settings.muted) return;
  type = type || 'sine'; g = (g || 0.14) * (SAVE.settings.se === undefined ? 0.8 : SAVE.settings.se); delay = delay || 0;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  v.gain.setValueAtTime(0.0001, t);
  v.gain.linearRampToValueAtTime(g, t + 0.025);           // 更柔的起音，消除咔哒
  v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  /* 音色柔化链：低通滤波（截止=基频×4，去方波/锯齿毛刺）→ 指数压限 */
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.value = Math.min(9000, f * 4); lp.Q.value = 0.5;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6; comp.attack.value = .004; comp.release.value = .18;
  o.connect(v); v.connect(lp); lp.connect(comp); comp.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.06);
}
const sfx = {
  click:   () => tone(660, .06, 'sine', .045),
  place:   () => { tone(240, .1, 'triangle', .1); tone(480, .05, 'sine', .035, .01); },
  merge:   (tier, ci) => {                       // 五声音阶：连锁沿音阶爬升，等级越低音越沉
             const PENT = [0, 2, 4, 7, 9];
             const step = PENT[(ci || 0) % 5] + Math.floor((ci || 0) / 5) * 12 - Math.floor(tier * 1.5);
             const f = 392 * Math.pow(2, step / 12);          // 基音下移纯四度（G4）
             tone(f, .22, 'triangle', .13);
             tone(f * 2, .14, 'sine', .045, .015); },         // 泛音弱化，不叠 1.5 倍非谐泛音
  deliver: () => { tone(523, .14, 'sine', .12); tone(659, .16, 'sine', .12, .1); tone(784, .22, 'sine', .09, .2); },
  warn:    () => { tone(587, .1, 'triangle', .055); tone(587, .1, 'triangle', .055, 1.0); tone(587, .14, 'triangle', .06, 2.0); },
  boom:    () => { tone(130, .55, 'triangle', .16, 0, 48); tone(58, .9, 'sine', .24); },
  crash:   () => { tone(150, .8, 'triangle', .16, 0, 42); tone(55, 1.1, 'sine', .26, .05, 30); },
  win:     () => { [392, 523, 659, 784].forEach((f, i) => tone(f, .34, 'sine', .12, i * .14)); },
  swallow: () => tone(150, .5, 'sine', .18, 0, 70),
};
document.addEventListener('pointerdown', ensureAudio, { once:false });
/* 环境音乐（FR-1102 BGM）：Web Audio 合成的低音铺底，音量受设置控制 */
let BGM = null;
function startBgm() {
  if (BGM || !AC || SAVE.settings.bgm <= 0 || SAVE.settings.muted) return;
  const g = AC.createGain(); g.gain.value = 0.03 * SAVE.settings.bgm;
  const flt = AC.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 900;
  const oscs = [110, 164.81, 220].map((f, i) => {
    const o = AC.createOscillator(); o.type = i === 2 ? 'sine' : 'triangle';
    o.frequency.value = f; o.detune.value = (i - 1) * 4; o.connect(flt); o.start(); return o;
  });
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.08;
  const lg = AC.createGain(); lg.gain.value = 0.012 * SAVE.settings.bgm;
  lfo.connect(lg); lg.connect(g.gain); lfo.start();
  flt.connect(g); g.connect(AC.destination);
  BGM = { oscs, g, lfo, lg };
}
function updateBgm() {
  if (!BGM) { startBgm(); return; }
  const v = (SAVE.settings.muted || SAVE.settings.bgm <= 0) ? 0 : 0.03 * SAVE.settings.bgm;
  BGM.g.gain.value = v; BGM.lg.gain.value = v * 0.4;
  if (v === 0) { BGM.oscs.forEach(o => o.stop()); BGM.lfo.stop(); BGM = null; }
}

/* =============== DOM =============== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const elTop = document.getElementById('topbar'), elBottom = document.getElementById('bottombar');
const elLvl = document.getElementById('lvlname'), elStats = document.getElementById('stats'), elHint = document.getElementById('hint');
const elPool = document.getElementById('pool'), elToast = document.getElementById('toast');
const elOverlay = document.getElementById('overlay');
const elCD = document.getElementById('cDiscard'), elCS = document.getElementById('cSlide');
const tDiscard = document.getElementById('tDiscard'), tSlide = document.getElementById('tSlide');

const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = 1600 * DPR; cv.height = 900 * DPR;

function resize() {
  const w = window.innerWidth - 12, h = window.innerHeight - 12;
  const W = Math.min(w, h * 16 / 9);

function slotPos(k, i) { const a = slotAngle(k, i); return [CX + RADII[k] * Math.cos(a), CY + RADII[k] * Math.sin(a)]; }
function easeOutBack(t) { const c = 1.70158; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

/* mulberry32：种子随机（每日挑战确定性，FR-1201） */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 动态订单（FR-306）：同时挂 3 张滚动订单，120s 保鲜，过期/完成即换单，超时不失败 */
const DYN_FRESH = 120;
function dynNewOrder() {
  const w = [0, 0, 1, 2, 3, 4, 4, 4, 3, 3, 2, 1, 1];
  let tot = 0; w.forEach(v => tot += v);
  let r2 = Math.random() * tot, tier = 2;
  for (let i = 0; i < w.length; i++) { r2 -= w[i]; if (r2 <= 0) { tier = 2 + i; break; } }
  const now = S ? S.time : 0;

    delivered: 0, litAt: -1, bornAt: now, expireAt: now + DYN_FRESH };
}

/* 棋盘规则（配对/外迁/黑洞吞噬）由核心模块 resolveBoard 驱动，壳只做演出与记帐 */
function resolve() {
  let cnt = 0, last = null;
  C.resolveBoard(S.board, {
    onMerge: m => {
      const [ax, ay] = slotPos(m.from[0][0], m.from[0][1]);
      const [bx, by] = slotPos(m.from[1][0], m.from[1][1]);
      const [px, py] = slotPos(m.to[0], m.to[1]);
      m.prod.born = S.time + 0.12;
      S.merges.push({ ax, ay, bx, by, px, py, at: S.time, t: m.tier });
      S._resoTmp += mass(m.product) * 0.1; // 共振奖励累计（FR-403，仅连锁 n≥2 时计入）
      unlockDex(m.prod);
      sfx.merge(m.tier, cnt);
      if (m.devoured && m.devoured.length) {
        let lm = 0;
        m.devoured.forEach(d => { lm += mass(d.t); const [x, y] = slotPos(d.k, d.i); burst(x, y, '#b08cff', 14); });
        S.loss += lm;
        S.rings.push({ x: px, y: py, at: S.time, dur: .9, r1: 130, color: '#b08cff', lw: 5 });
        sfx.swallow();
        toast('黑洞诞生！吞噬了 ' + m.devoured.length + ' 个邻近天体（计入质量损失）');
      }
      tutEvent('merged');
      last = [px, py, mass(m.product)];
      cnt++;
    }
  });
  return { cnt, last };
}
function afterAction() {
  const r = resolve();
  if (r.cnt >= 2 && S._resoTmp > 0) {
    S.score += S._resoTmp; S.reso += S._resoTmp;
    S.floats.push({ x: r.last[0], y: r.last[1] - 30, at: S.time, dur: 1.2,
      text: '共振 +' + fmtMass(S._resoTmp), color: '#ffd76a', size: 18 });
    S._resoTmp = 0;
  } else if (r.cnt < 2) S._resoTmp = 0;
  if (r.cnt > S.maxCombo) S.maxCombo = r.cnt;
  if (r.cnt >= 4) ach('combo4');
  if (r.cnt >= 2) S.comboFlash = { n: r.cnt, at: S.time };
  updateHUD();
  checkEnd();
}

/* =============== 特效 =============== */
const PART_POOL = [];
function burst(x, y, color, n) {
  if (SAVE.settings.reducedMotion) n = Math.max(2, Math.floor(n * 0.3)); // FR-803：粒子削减 ≥70%
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rnd(40, 190);
    const pt = PART_POOL.pop() || {};                        // 对象池：优先复用
    pt.x = x; pt.y = y; pt.vx = Math.cos(a)*v; pt.vy = Math.sin(a)*v;
    pt.life = rnd(.4,.9); pt.t0 = S.time; pt.color = color; pt.r = rnd(1.5,3.5);
    S.parts.push(pt);
  }
}

/* =============== 每帧更新 =============== */
function update(dt) {
  S.time += dt;
  // 彗星漂移
  if (S.time >= S.driftAt) {
    S.driftAt = S.time + 5;
    let moved = false;
    for (let k = 0; k < 4; k++) for (let i = 0; i < ORBITS[k]; i++) {
      const b = S.board[k][i];
      if (b && b.t === 1) { const j = (i + 1) % ORBITS[k];
        if (!S.board[k][j]) { S.board[k][j] = b; S.board[k][i] = null; moved = true; } }
    }
    if (moved) { const r = resolve(); if (r.cnt) { S._resoTmp = 0; updateHUD(); checkEnd(); } }
  }
  // 陨石调度
  if (S.time >= S.nextMeteorAt) {
    S.nextMeteorAt = S.time + S.lvl.meteor;
    const occ = [];
    for (let k = 0; k < 4; k++) for (let i = 0; i < ORBITS[k]; i++) if (S.board[k][i]) occ.push([k, i]);
    if (occ.length) {
      const [k, i] = occ[Math.floor((S.rng ? S.rng() : Math.random()) * occ.length)];
      S.warns.push({ k, i, start: S.time, impact: S.time + 3 });
      sfx.warn();
      tutEvent('warn-shown');
    }
  }
  // 动态订单保鲜（FR-306）
  if (S.mode === 'dynamic') {
    for (let n = 0; n < S.order.length; n++) {
      if (S.time >= S.order[n].expireAt) {
        toast('订单过期 ⌛ 已更换新订单');
        S.order[n] = dynNewOrder();
        S.order[n].bornAt = S.time; S.order[n].expireAt = S.time + DYN_FRESH;
      }
    }
  }
  // 陨石命中
  for (let n = S.warns.length - 1; n >= 0; n--) {
    const w = S.warns[n];
    if (S.time >= w.impact) {
      S.warns.splice(n, 1);
      const b = S.board[w.k][w.i];
      if (b) {
        const [x, y] = slotPos(w.k, w.i);
        if (b.t === 0) { S.board[w.k][w.i] = null; }
        else { S.loss += mass(b.t) - mass(b.t - 1); b.t--; b.born = S.time; unlockDex(b); }
        burst(x, y, '#ff9f6a', 16);
        S.rings.push({ x, y, at: S.time, dur:.5, r1: 60, color:'#ff8a5a', lw:4 });
        S.shake = Math.max(S.shake, .3);
        tone(180, .25, 'sawtooth', .12, 0, 70);
        const r = resolve(); if (r.cnt) { S._resoTmp = 0; }
        updateHUD();
      }
    }
  }
  updateFx(dt);
  if (MODE === 'winning' && S.time >= S.wonAt) { MODE = 'won'; showWin(); }
  if (MODE === 'crashing' && S.time >= S.crashAt) { MODE = 'crash'; showCrash(); }
}
function updateFx(dt) {
  for (let n = S.parts.length - 1; n >= 0; n--) { const p = S.parts[n];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .99; p.vy *= .99;
    if (S.time - p.t0 > p.life) { PART_POOL.push(S.parts.splice(n, 1)[0]); } }
  for (let n = S.floats.length - 1; n >= 0; n--) if (S.time - S.floats[n].at > S.floats[n].dur) S.floats.splice(n, 1);
  for (let n = S.merges.length - 1; n >= 0; n--) if (S.time - S.merges[n].at > .5) S.merges.splice(n, 1);
  for (let n = S.dels.length - 1; n >= 0; n--) { const d = S.dels[n];
    if (S.time - d.at > .62) { if (d.oi >= 0 && S.order[d.oi]) S.order[d.oi].litAt = S.time; S.dels.splice(n, 1); } }
  for (let n = S.rings.length - 1; n >= 0; n--) if (S.time - S.rings[n].at > S.rings[n].dur) S.rings.splice(n, 1);
  S.shake = Math.max(0, S.shake - dt * 1.4);
}

function canvasXY(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * 1600 / r.width, (e.clientY - r.top) * 900 / r.height];
}
function hitSlot(x, y) {
  let best = null, bd = 1e9;
  for (let k = 0; k < 4; k++) for (let i = 0; i < ORBITS[k]; i++) {
    const [sx, sy] = slotPos(k, i);
    const b = S.board[k][i];
    const d = Math.hypot(x - sx, y - sy);
    const th = Math.max(26, (b ? bodyR(b.t) : 10) + 8);
    if (d < th && d < bd) { bd = d; best = [k, i]; }
  }
  return best;
}
cv.addEventListener('mousemove', e => {
  mouse = canvasXY(e);
  hover = (S && MODE === 'play') ? hitSlot(mouse[0], mouse[1]) : null;
  cv.style.cursor = hover ? 'pointer' : 'default';
});
cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelTool(); });
cv.addEventListener('pointerdown', e => {
  if (!S || MODE !== 'play') return;
  const [x, y] = canvasXY(e);
  const hit = hitSlot(x, y);
  if (!hit) { cancelTool(); return; }
  const [k, i] = hit, b = S.board[k][i];
  // 工具模式
  if (S.tool === 'discard' && b) {
    S.loss += mass(b.t); S.board[k][i] = null; S.discard--; S.tool = null;
    const [sx, sy] = slotPos(k, i); burst(sx, sy, '#ff8a8a', 12);
    toast('已弃置 ' + BODIES[b.t].name + '（质量计入损失）');
    tone(200, .18, 'sawtooth', .1, 0, 80);
    updateHUD(); return;
  }
  if (S.tool === 'slide') {
    if (b) { if (b.t === 14) { toast('黑洞无法被移动'); return; }
      S.slideSrc = [k, i]; toast('再点击同一轨道的一个空槽位完成滑移'); return; }
    if (S.slideSrc) {
      const [sk, si] = S.slideSrc;
      if (sk !== k) { toast('潮汐滑移只能沿同一轨道移动'); return; }
      if (isFrozen(k, i)) { toast('目标槽位被冰封'); return; }
      if (pathClear(sk, si, i)) {
        S.board[k][i] = S.board[sk][si]; S.board[sk][si] = null;
        S.slide--; S.tool = null; S.slideSrc = null;
        const [sx, sy] = slotPos(k, i);
        S.rings.push({ x:sx, y:sy, at:S.time, dur:.4, r1: 44, color:'#9fe8ff', lw:3 });
        tone(520, .12, 'sine', .1);
        afterAction();
        tutEvent('slide-used'); return;
      } else { toast('路径被阻挡，无法滑移'); return; }
    }
    toast('先选择要移动的天体'); return;
  }
  // 常规：空槽投放 / 天体交付或技能
  if (!b) {
    if (S.pool[S.sel] === undefined) return;
    S._resoTmp = 0;
    placeExtra(k, i);
    return;
  }
  if (deliver(k, i)) { checkEnd(); return; }
  if (b.t === 13) { if (b.v === 'pulse') detonatePulse(k, i); else supernova(k, i); return; }
  if (b.t === 14) { toast('黑洞只能作为终章订单目标交付'); return; }
  toast('当前订单不需要 ' + BODIES[b.t].name);
});
function placeExtra(k, i) {
  if (S.board[k][i]) return;
  if (isFrozen(k, i)) { toast('该槽位被冰封，无法投放'); return; }
  const it = S.pool[S.sel];
  const b = { t: (it && it.t !== undefined) ? it.t : it, born: S.time };
  if (it && it.v) b.v = it.v;
  S.board[k][i] = b;
  S.drops++; sfx.place();
  unlockDex(b);
  if (S.mode === 'endless' || S.mode === 'dynamic') {
    const nt = Math.min(13, 2 + Math.floor(S.drops / 8));
    if (nt > S.lvl.pool[1]) { S.lvl.pool[1] = nt; toast('候选池扩展：可投放至 ' + C.BODIES[nt].name); }
  }
  if (S.tut) { const st = S.tut.steps[S.tut.idx]; if (st && st.mark) S.tut.mark = [k, i]; }
  rollPool();
  afterAction();
  tutEvent('placed');
}

  const neb = [ [400,220,'90,60,180'], [1250,700,'40,120,170'], [800,500,'150,80,140'] ];
  neb.forEach(([x, y, c]) => {
    const a = 0.05 + 0.16 * (key / 20);
    const rg = g.createRadialGradient(x, y, 0, x, y, 320);
    rg.addColorStop(0, 'rgba(' + c + ',' + a.toFixed(3) + ')'); rg.addColorStop(1, 'rgba(' + c + ',0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, 320, 0, 6.29); g.fill();

    const nSeg = Math.max(1, Math.ceil((S.order.length - 1) * lineP));
    for (let i = 0; i <= nSeg && i < S.order.length; i++) {
      const [x, y] = starPos(i);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // 星与进度
  S.order.forEach((o, i) => {
    const [x, y] = starPos(i);
    const done = o.delivered >= o.count;
    const lit = done && S.time >= o.litAt;
    if (lit) { ctx.save(); ctx.shadowColor = '#ffd76a'; ctx.shadowBlur = 18; }
    starPath(x, y, 15);
    ctx.fillStyle = lit ? '#ffd76a' : (done ? '#b8a25a' : 'rgba(120,135,190,.35)');
    ctx.fill();
    if (lit) ctx.restore();
    ctx.strokeStyle = 'rgba(200,215,255,.5)'; ctx.lineWidth = 1; starPath(x, y, 15); ctx.stroke();
    // 进度点
    for (let d = 0; d < o.count; d++) {
      ctx.fillStyle = d < o.delivered ? '#ffd76a' : 'rgba(130,145,200,.4)';
      ctx.beginPath(); ctx.arc(x - (o.count - 1) * 5 + d * 10, y + 26, 3, 0, 6.29); ctx.fill();
    }
    ctx.font = '12.5px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = done ? '#ffe9a8' : '#aab6e8';
    ctx.fillText(BODIES[o.tier].name + (o.count > 1 ? ' ×' + o.count : '') + '（' + o.delivered + '/' + o.count + '）', x, y + 42);
  });
}
function wrapText(text, maxW, font) {
  ctx.font = font; const lines = []; let cur = '';
  for (const ch of text) {
    if (ctx.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawTutorial() {
  if (!S || !S.tut || MODE === 'menu') return;
  const t = S.tut, st = t.steps[t.idx]; if (!st) return;
  const r = tutRect(st);
  const isDomHl = !!(st.hl && st.hl.dom);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, 1600, 900);
  if (r && !isDomHl) ctx.roundRect(r.x - 8, r.y - 8, r.w + 16, r.h + 16, 14);
  ctx.fillStyle = 'rgba(3,6,15,.58)'; ctx.fill('evenodd');
  if (r && !isDomHl) {
    const a = .55 + .35 * Math.sin(vt * 4.5);
    ctx.strokeStyle = 'rgba(255,215,106,' + a.toFixed(3) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(r.x - 8, r.y - 8, r.w + 16, r.h + 16, 14); ctx.stroke();
  }
  const font = '15.5px "Microsoft YaHei", sans-serif';
  let lines = wrapText(st.text, 350, font);
  if (st.wait === 'any') lines = lines.concat(['▾ 点击任意处继续 ▾']);
  ctx.font = font;
  let tw = 0; lines.forEach(l => tw = Math.max(tw, ctx.measureText(l).width));
  const bw = tw + 30, bh = lines.length * 23 + 26;
  let bx, by;
  if (r) {
    bx = Math.max(30, Math.min(1570 - bw, r.x + r.w / 2 - bw / 2));
    if (r.y + r.h + bh + 70 < 880) by = r.y + r.h + 26; else by = Math.max(70, r.y - bh - 26);
  } else { bx = 800 - bw / 2; by = 396 - bh / 2; }
  ctx.fillStyle = 'rgba(12,20,46,.96)'; ctx.strokeStyle = 'rgba(255,215,106,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 12); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i2) => {
    const isHint = i2 === lines.length - 1 && st.wait === 'any';
    ctx.fillStyle = isHint ? 'rgba(160,175,225,.9)' : '#ffe9a8';
    ctx.fillText(l, bx + 15, by + 11 + i2 * 23);
  });
  ctx.fillStyle = 'rgba(150,165,215,.75)'; ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText((t.idx + 1) + '/' + t.steps.length, bx + bw - 10, by + bh - 16);
  if (r) {
    const tx = r.x + r.w / 2;
    let sy, ty;
    if (by < r.y) { sy = by + bh; ty = r.y - 10; } else { sy = by; ty = r.y + r.h + 10; }
    const s = Math.sign(ty - sy) || 1;
    ctx.strokeStyle = 'rgba(255,215,106,.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(tx, sy); ctx.lineTo(tx, ty - s * 8); ctx.stroke();
    ctx.fillStyle = 'rgba(255,215,106,.95)';
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx - 7, ty - s * 12); ctx.lineTo(tx + 7, ty - s * 12);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const p = !S ? 0.15 : ((S.mode === 'endless' || S.mode === 'dynamic')
    ? S.board.flat().filter(c => !c).length / 28
    : S.order.reduce((a, o) => a + o.delivered, 0) / Math.max(1, S.order.reduce((a, o) => a + o.count, 0)));
  drawBackground(S ? p : 0.12);
  ctx.save();
  if (S && S.shake > 0 && !SAVE.settings.reducedMotion) ctx.translate(rnd(-1, 1) * S.shake * 8, rnd(-1, 1) * S.shake * 8);
  drawSun();
  if (S) {
    drawBoard(); drawEffects(); drawConstellation(); drawComboFlash(); drawTutorial(); drawVignette(); drawPerf();
    // 顶部关卡进度条（背景即进度条 v0.1：星云已随 p 增强）
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(560, 876, 480, 5);
    ctx.fillStyle = '#ffd76a'; ctx.fillRect(560, 876, 480 * p, 5);
  } else {
    // 菜单装饰盘面
    for (let k = 0; k < 4; k++) {
      ctx.strokeStyle = 'rgba(160,180,255,.10)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(CX, CY, RADII[k], 0, 6.29); ctx.stroke();
    }
  }
  ctx.restore();
}

/* =============== 主循环 =============== */
const perf = { on: false, dt: [] };
document.addEventListener('keydown', e => {
  if (e.key === 'F9') { e.preventDefault(); perf.on = !perf.on; perf.dt = []; }
});
function drawPerf() {
  if (!perf.on || perf.dt.length < 30) return;
  const fs = perf.dt.map(d => 1 / d).sort((a, b) => a - b);
  const avg = fs.reduce((a, b) => a + b, 0) / fs.length;
  const p95 = fs[Math.floor(fs.length * .95)];
  const drops = fs.filter(f => f < 30).length;
  ctx.fillStyle = 'rgba(8,12,28,.85)'; ctx.strokeStyle = 'rgba(130,150,255,.4)';
  ctx.beginPath(); ctx.roundRect(16, 64, 280, 74, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = avg >= 55 ? '#9fe8ff' : '#ff8a8a';
  ctx.font = 'bold 15px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('FPS 采样（F9 关闭）', 28, 72);
  ctx.font = '13px "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#dfe6ff';
  ctx.fillText('平均 ' + avg.toFixed(1) + ' · P95 ' + p95.toFixed(1) + ' · 掉帧 ' + drops, 28, 96);
  ctx.fillStyle = '#8896c8';
  ctx.fillText('样本 ' + fs.length + ' 帧（NFR-P01 ≥55）', 28, 116);
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (perf.on) { perf.dt.push(dt); if (perf.dt.length > 600) perf.dt.shift(); }
  vt += dt;
  if (S && (MODE === 'play')) update(dt);
  else if (S && (MODE === 'winning' || MODE === 'crashing')) { S.time += dt; updateFx(dt);
    if (MODE === 'winning' && S.time >= S.wonAt) { MODE = 'won'; showWin(); }
    if (MODE === 'crashing' && S.time >= S.crashAt) { MODE = 'crash'; showCrash(); } }
  render();
  requestAnimationFrame(loop);
}
updateMuteIcon();
showMenu();
requestAnimationFrame(loop);
</script>
